<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23173b31'/%3E%3Cpath d='M20 20v17c0 15 24 15 24 0V20' fill='none' stroke='%23d5ee96' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b31" />
    <script id="uangku-theme-bootstrap">
      (() => {
        let preference = 'system';
        try {
          const stored = localStorage.getItem('uangku:theme:v1');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch {}
        let systemDark = false;
        try { systemDark = matchMedia('(prefers-color-scheme: dark)').matches; } catch {}
        const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111a16' : '#173b31');
      })();
    </script>
    <style>html[data-theme="dark"]{background:#111a16;color-scheme:dark}html[data-theme="light"]{background:#f7f8f3;color-scheme:light}</style>
    <meta name="description" content="Uangku — catatan uang yang lebih tenang. Dompet, cash, dan mata uangmu dalam satu tempat." />
    <title>Uangku — uangmu, lebih rapi.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
