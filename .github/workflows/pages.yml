name: Publikasikan Uangku

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmed_release:
        description: 'Saya menyetujui publikasi setelah seluruh gate lulus'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Periksa kandidat sebelum publikasi
    if: github.event_name == 'push' || inputs.confirmed_release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Tes dan siapkan situs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6
      - name: Siapkan Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pasang dependency dari lockfile
        run: npm ci
      - name: Jalankan tes
        run: npm test
      - name: Buat build produksi
        run: npm run build
      - name: Catat identitas rilis
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const commit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw new Error('Missing release commit');
          const htmlSha256 = createHash('sha256').update(readFileSync('dist/index.html')).digest('hex');
          writeFileSync('dist/BUILD_INFO.json', JSON.stringify({ commit, htmlSha256 }) + '\n');
          JS
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah situs
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publikasikan situs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
