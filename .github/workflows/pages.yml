name: Publikasikan Uangku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Tes dan siapkan situs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6
      - name: Siapkan Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pasang dependency dari lockfile
        run: npm ci
      - name: Jalankan tes
        run: npm test
      - name: Buat build produksi
        run: npm run build
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah situs
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publikasikan situs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
