name: Publikasikan Uangku

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmed_release:
        description: 'Saya menyetujui publikasi setelah seluruh gate lulus'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Periksa kandidat sebelum publikasi
    if: github.event_name == 'push' || inputs.confirmed_release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Siapkan situs
    permissions:
      contents: read
      pages: read # configure-pages membaca konfigurasi situs yang sudah aktif.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Siapkan Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pasang dependency dari lockfile
        run: npm ci
      - name: Buat build produksi
        run: npm run build
      - name: Catat identitas rilis
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const commit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw new Error('Missing release commit');
          const htmlSha256 = createHash('sha256').update(readFileSync('dist/index.html')).digest('hex');
          writeFileSync('dist/BUILD_INFO.json', JSON.stringify({ commit, htmlSha256 }) + '\n');
          JS
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Unggah situs
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publikasikan situs
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
